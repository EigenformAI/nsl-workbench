<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'"
    />
    <title>Run visualisation</title>
    <style>
      :root {
        color-scheme: light;
        --surface: #fcfcfb;
        --text: #0b0b0b;
        --text-2: #52514e;
        --muted: #898781;
        --grid: #e1e0d9;
        --axis: #c3c2b7;
        --ring: rgba(11, 11, 11, 0.1);
        --hover: rgba(11, 11, 11, 0.045);
        --band: rgba(11, 11, 11, 0.035);
        --shadow: 0 12px 32px rgba(11, 11, 11, 0.14);
        --good: #0ca30c;
        --good-text: #006300;
        --warning: #fab219;
        --passed: #c3c2b7;
        --track: #f0efec;
        --offsieve: #898781;
        --edge: #898781;
        --series: #2a78d6;
        --cat-1: #2a78d6;
        --cat-2: #eb6834;
        --cat-3: #1baf7a;
        --cat-4: #eda100;
        --cat-5: #e87ba4;
        --cat-6: #008300;
        --cat-7: #6250d6;
        --cat-8: #e34948;
        --cat-other: #898781;
        --cat-ink-1: #ffffff;
        --cat-ink-2: #ffffff;
        --cat-ink-3: #ffffff;
        --cat-ink-4: #0b0b0b;
        --cat-ink-5: #ffffff;
        --cat-ink-6: #ffffff;
        --cat-ink-7: #ffffff;
        --cat-ink-8: #ffffff;
        --cat-ink-other: #ffffff;
        --seq-1: #cde2fb;
        --seq-2: #9ec5f4;
        --seq-3: #6da7ec;
        --seq-4: #3987e5;
        --seq-5: #256abf;
        --seq-6: #184f95;
        --seq-7: #0d366b;
        --seq-ink-1: #0b0b0b;
        --seq-ink-2: #0b0b0b;
        --seq-ink-3: #0b0b0b;
        --seq-ink-4: #ffffff;
        --seq-ink-5: #ffffff;
        --seq-ink-6: #ffffff;
        --seq-ink-7: #ffffff;
        --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
        --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --surface: #1a1a19;
          --text: #f0efec;
          --text-2: #c3c2b7;
          --muted: #898781;
          --grid: #2c2c2a;
          --axis: #383835;
          --ring: rgba(255, 255, 255, 0.1);
          --hover: rgba(255, 255, 255, 0.06);
          --band: rgba(255, 255, 255, 0.04);
          --shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
          --good-text: #0ca30c;
          --passed: #52514e;
          --track: #2c2c2a;
          --series: #3987e5;
          --cat-1: #3987e5;
          --cat-2: #d95926;
          --cat-3: #199e70;
          --cat-4: #c98500;
          --cat-5: #d55181;
          --cat-6: #008300;
          --cat-7: #9085e9;
          --cat-8: #e66767;
          --cat-ink-4: #ffffff;
          --seq-1: #0d366b;
          --seq-2: #184f95;
          --seq-3: #256abf;
          --seq-4: #3987e5;
          --seq-5: #6da7ec;
          --seq-6: #9ec5f4;
          --seq-7: #cde2fb;
          --seq-ink-1: #ffffff;
          --seq-ink-2: #ffffff;
          --seq-ink-3: #ffffff;
          --seq-ink-4: #ffffff;
          --seq-ink-5: #0b0b0b;
          --seq-ink-6: #0b0b0b;
          --seq-ink-7: #0b0b0b;
        }
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --surface: #1a1a19;
        --text: #f0efec;
        --text-2: #c3c2b7;
        --muted: #898781;
        --grid: #2c2c2a;
        --axis: #383835;
        --ring: rgba(255, 255, 255, 0.1);
        --hover: rgba(255, 255, 255, 0.06);
        --band: rgba(255, 255, 255, 0.04);
        --shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
        --good-text: #0ca30c;
        --passed: #52514e;
        --track: #2c2c2a;
        --series: #3987e5;
        --cat-1: #3987e5;
        --cat-2: #d95926;
        --cat-3: #199e70;
        --cat-4: #c98500;
        --cat-5: #d55181;
        --cat-6: #008300;
        --cat-7: #9085e9;
        --cat-8: #e66767;
        --cat-ink-4: #ffffff;
        --seq-1: #0d366b;
        --seq-2: #184f95;
        --seq-3: #256abf;
        --seq-4: #3987e5;
        --seq-5: #6da7ec;
        --seq-6: #9ec5f4;
        --seq-7: #cde2fb;
        --seq-ink-1: #ffffff;
        --seq-ink-2: #ffffff;
        --seq-ink-3: #ffffff;
        --seq-ink-4: #ffffff;
        --seq-ink-5: #0b0b0b;
        --seq-ink-6: #0b0b0b;
        --seq-ink-7: #0b0b0b;
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--surface);
        color: var(--text);
        font: 14px/1.45 var(--sans);
        overflow-x: hidden;
      }
      button {
        font: inherit;
        color: inherit;
      }
      :focus-visible {
        outline: 2px solid var(--series);
        outline-offset: 2px;
      }
      .page {
        max-width: 1680px;
        margin: 0 auto;
        padding: 20px 24px 48px;
        transition: padding-right 0.2s ease;
      }
      .top {
        display: flex;
        flex-wrap: wrap;
        gap: 12px 24px;
        align-items: flex-start;
        justify-content: space-between;
      }
      .top h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 600;
        line-height: 1.3;
        overflow-wrap: anywhere;
      }
      .meta {
        margin: 4px 0 0;
        color: var(--text-2);
        font-size: 13px;
      }
      .meta span + span::before {
        content: "\00b7";
        margin: 0 8px;
        color: var(--muted);
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .btn {
        border: 1px solid var(--ring);
        background: var(--surface);
        border-radius: 8px;
        padding: 6px 12px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 32px;
      }
      .btn:hover {
        background: var(--hover);
      }
      .btn[aria-pressed="true"] {
        border-color: var(--text-2);
      }
      .btn .count {
        color: var(--text-2);
        font-variant-numeric: tabular-nums;
      }
      .notice {
        margin: 12px 0 0;
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 13px;
        border: 1px solid var(--ring);
        color: var(--text-2);
        display: flex;
        gap: 8px;
      }
      .notice .icon {
        color: var(--text);
        font-weight: 600;
      }
      .notice strong {
        color: var(--text);
        font-weight: 600;
      }
      .chips {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 16px 0 0;
        flex-wrap: wrap;
      }
      .chips .label {
        color: var(--text-2);
        font-size: 13px;
        margin-right: 4px;
      }
      .chip-row {
        display: flex;
        align-items: center;
        gap: 8px;
        flex: 1 1 240px;
        min-width: 0;
        overflow-x: auto;
        padding: 2px;
        scrollbar-width: thin;
      }
      .chip {
        border: 1px solid var(--ring);
        background: var(--surface);
        border-radius: 999px;
        padding: 4px 12px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 13px;
        min-height: 30px;
        flex: none;
        white-space: nowrap;
      }
      .chip:hover {
        background: var(--hover);
      }
      .chip[aria-pressed="true"] {
        border-color: var(--text);
        box-shadow: inset 0 0 0 1px var(--text);
      }
      .chip .n {
        color: var(--text-2);
        font-variant-numeric: tabular-nums;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        display: inline-block;
        flex: none;
      }
      .filter-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 4px 4px 12px;
        border-radius: 999px;
        background: var(--hover);
        font-size: 13px;
        max-width: 100%;
      }
      .filter-pill .v {
        font-family: var(--mono);
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      .filter-pill button {
        border: 0;
        background: transparent;
        cursor: pointer;
        border-radius: 50%;
        width: 24px;
        height: 24px;
        line-height: 1;
        color: var(--text-2);
      }
      .filter-pill button:hover {
        background: var(--hover);
        color: var(--text);
      }
      main {
        margin-top: 16px;
        display: grid;
        gap: 16px;
      }
      .row {
        display: grid;
        gap: 16px;
        grid-template-columns: minmax(0, 1fr);
      }
      @media (min-width: 900px) {
        .row-a {
          grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
        }
        .row-b {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
        }
      }
      @media (min-width: 1180px) {
        body.drawer-open .page {
          padding-right: 464px;
        }
      }
      .panel {
        border: 1px solid var(--ring);
        border-radius: 12px;
        padding: 16px;
        min-width: 0;
        background: var(--surface);
      }
      .panel-head {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        justify-content: space-between;
      }
      .panel-head h2 {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }
      .panel-head p {
        margin: 2px 0 0;
        color: var(--text-2);
        font-size: 13px;
        max-width: 72ch;
      }
      .panel-head .btn {
        flex: none;
        padding: 4px 10px;
        min-height: 28px;
        font-size: 13px;
      }
      .panel-body {
        margin-top: 12px;
      }
      .scroller {
        overflow-x: auto;
        overflow-y: hidden;
        -webkit-overflow-scrolling: touch;
      }
      .scroller svg {
        display: block;
      }
      .legend {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        margin-top: 12px;
        font-size: 12px;
        color: var(--text-2);
        align-items: center;
      }
      .legend .item {
        display: inline-flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 6px;
      }
      .legend .title {
        color: var(--text);
        font-weight: 500;
        white-space: nowrap;
      }
      .legend svg {
        display: block;
        flex: none;
      }
      .swatch {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        display: inline-block;
        flex: none;
      }
      .ramp {
        display: inline-flex;
        gap: 2px;
      }
      .ramp .swatch {
        width: 14px;
        border-radius: 2px;
      }
      .note {
        margin-top: 8px;
        font-size: 12px;
        color: var(--text-2);
      }
      .empty {
        border: 1px dashed var(--axis);
        border-radius: 10px;
        padding: 28px 16px;
        text-align: center;
        color: var(--text-2);
      }
      .empty strong {
        display: block;
        color: var(--text);
        font-weight: 600;
        margin-bottom: 4px;
      }
      svg text {
        font-family: var(--sans);
        font-size: 11px;
        fill: var(--text-2);
      }
      svg text.muted {
        fill: var(--muted);
      }
      svg text.strong {
        fill: var(--text);
        font-weight: 600;
      }
      svg text.num {
        font-variant-numeric: tabular-nums;
      }
      svg text.halo {
        paint-order: stroke;
        stroke: var(--surface);
        stroke-width: 4px;
        stroke-linejoin: round;
      }
      svg .hit {
        fill: transparent;
        cursor: pointer;
      }
      svg .hit:hover,
      svg .hit:focus-visible {
        fill: var(--hover);
      }
      svg .hit:focus-visible {
        outline: none;
        stroke: var(--series);
        stroke-width: 2;
      }
      svg .node-g {
        cursor: pointer;
      }
      svg .node-g:focus-visible {
        outline: none;
      }
      svg .node-g:focus-visible .node-hit {
        stroke: var(--series);
        stroke-width: 2;
      }
      svg .node-hit {
        fill: transparent;
      }
      svg .node-g:hover .node-hit {
        fill: var(--hover);
      }
      svg .gridline {
        stroke: var(--grid);
        stroke-width: 1;
      }
      svg .baseline {
        stroke: var(--axis);
        stroke-width: 1;
      }
      svg .dim {
        opacity: 0.16;
      }
      svg .dim .hit,
      svg .dim.hit {
        pointer-events: none;
      }
      .cov {
        display: flex;
        flex-wrap: wrap;
        gap: 16px 20px;
      }
      .cov-group {
        min-width: 0;
        flex: 0 1 auto;
        max-width: 100%;
      }
      .cov-group-label {
        font-size: 12px;
        color: var(--text-2);
        margin-bottom: 6px;
      }
      .cov-group-label b {
        color: var(--text);
        font-weight: 600;
      }
      .cov-cells {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .cov-cell {
        width: 132px;
        min-height: 64px;
        padding: 6px 8px;
        text-align: left;
        cursor: pointer;
        border-radius: 6px;
        border: 1px solid var(--grid);
        background: var(--surface);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 4px;
      }
      .cov-cell:hover {
        box-shadow: inset 0 0 0 1px var(--text-2);
      }
      .cov-cell .nm {
        font-size: 12px;
        line-height: 1.25;
        overflow-wrap: anywhere;
      }
      .cov-cell .ct {
        font-size: 11px;
        font-variant-numeric: tabular-nums;
        opacity: 0.85;
      }
      .cov-cell.untouched {
        color: var(--muted);
      }
      .cov-cell.rejected-only {
        border: 1.5px dashed var(--muted);
        color: var(--text-2);
      }
      .cov-cell[data-bin="1"] {
        background: var(--seq-1);
        color: var(--seq-ink-1);
        border-color: transparent;
      }
      .cov-cell[data-bin="2"] {
        background: var(--seq-2);
        color: var(--seq-ink-2);
        border-color: transparent;
      }
      .cov-cell[data-bin="3"] {
        background: var(--seq-3);
        color: var(--seq-ink-3);
        border-color: transparent;
      }
      .cov-cell[data-bin="4"] {
        background: var(--seq-4);
        color: var(--seq-ink-4);
        border-color: transparent;
      }
      .cov-cell[data-bin="5"] {
        background: var(--seq-5);
        color: var(--seq-ink-5);
        border-color: transparent;
      }
      .cov-cell[data-bin="6"] {
        background: var(--seq-6);
        color: var(--seq-ink-6);
        border-color: transparent;
      }
      .cov-cell[data-bin="7"] {
        background: var(--seq-7);
        color: var(--seq-ink-7);
        border-color: transparent;
      }
      .cov-cell[aria-pressed="true"] {
        outline: 2px solid var(--text);
        outline-offset: 2px;
      }
      .cov-cell.faded {
        opacity: 0.5;
      }
      .sieve {
        display: grid;
        grid-template-columns: auto minmax(0, max-content) auto;
        justify-content: start;
        align-items: start;
      }
      .sieve-gen + .sieve-gen {
        margin-top: 16px;
      }
      .sieve-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 8px;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .sieve-head b {
        color: var(--text);
        font-size: 13px;
      }
      .pf {
        display: flex;
        gap: 10px;
      }
      .pf-panel {
        flex: none;
        width: 204px;
        border: 1px solid var(--ring);
        border-radius: 10px;
        padding: 10px;
      }
      .pf-panel h3 {
        margin: 0;
        font-size: 13px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .pf-panel .sub {
        font-size: 12px;
        color: var(--text-2);
      }
      .pf-panel .sec {
        font-size: 12px;
        color: var(--text);
        margin: 10px 0 4px;
      }
      .pf-panel .foot {
        font-size: 12px;
        color: var(--text-2);
        margin-top: 8px;
      }
      .table-wrap {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        font-size: 12px;
        width: 100%;
      }
      caption {
        text-align: left;
        color: var(--text-2);
        padding-bottom: 6px;
      }
      th,
      td {
        padding: 4px 8px;
        border-bottom: 1px solid var(--grid);
        text-align: left;
        vertical-align: top;
      }
      th {
        font-weight: 600;
        color: var(--text);
        white-space: nowrap;
      }
      td.n,
      th.n {
        text-align: right;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      td.mono {
        font-family: var(--mono);
        font-size: 11px;
      }
      td.wide {
        min-width: 16em;
      }
      .tip {
        position: fixed;
        z-index: 50;
        pointer-events: none;
        max-width: 320px;
        background: var(--surface);
        border: 1px solid var(--ring);
        border-radius: 8px;
        box-shadow: var(--shadow);
        padding: 8px 10px;
        font-size: 12px;
        color: var(--text-2);
      }
      .tip-title {
        color: var(--text);
        font-weight: 600;
        margin-bottom: 4px;
        overflow-wrap: anywhere;
      }
      .tip-row {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      .tip-row strong {
        color: var(--text);
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        overflow-wrap: anywhere;
      }
      .drawer {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(440px, 100vw);
        z-index: 40;
        background: var(--surface);
        border-left: 1px solid var(--ring);
        box-shadow: var(--shadow);
        transform: translateX(105%);
        transition: transform 0.2s ease;
        display: flex;
        flex-direction: column;
        visibility: hidden;
      }
      body.drawer-open .drawer {
        transform: none;
        visibility: visible;
      }
      @media (prefers-reduced-motion: reduce) {
        .drawer,
        .page {
          transition: none;
        }
      }
      .drawer-head {
        padding: 16px 16px 8px;
        border-bottom: 1px solid var(--grid);
      }
      .drawer-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .drawer-title h2 {
        margin: 0;
        font-size: 16px;
        font-weight: 600;
      }
      .drawer-tools {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
        align-items: center;
        font-size: 13px;
      }
      .drawer-tools label {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        cursor: pointer;
        color: var(--text-2);
      }
      .drawer-list {
        overflow-y: auto;
        padding: 12px 16px 32px;
        flex: 1 1 auto;
        display: grid;
        gap: 12px;
        align-content: start;
      }
      .card {
        border: 1px solid var(--ring);
        border-radius: 10px;
        padding: 12px;
        min-width: 0;
      }
      .card.focus {
        box-shadow: inset 0 0 0 2px var(--series);
      }
      .card-head {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
        font-size: 12px;
        color: var(--text-2);
      }
      .card-head .mono {
        font-family: var(--mono);
        font-size: 11px;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        font-weight: 600;
        color: var(--text);
        padding: 1px 8px 1px 6px;
        border-radius: 999px;
        border: 1px solid var(--ring);
      }
      .badge .ico {
        width: 12px;
        height: 12px;
        flex: none;
      }
      .badge.good {
        color: var(--good-text);
      }
      .hyp {
        margin: 8px 0 0;
        font-size: 14px;
        color: var(--text);
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .rewrite {
        margin: 8px 0 0;
        padding: 8px 10px;
        border-radius: 8px;
        background: var(--hover);
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      .rewrite .k,
      .field .k {
        display: block;
        font-size: 11px;
        color: var(--text-2);

    </style>
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
      <defs>
        <pattern
          id="hatch"
          patternUnits="userSpaceOnUse"
          width="4"
          height="4"
          patternTransform="rotate(45)"
        >
          <rect width="4" height="4" style="fill: var(--track)"></rect>
          <line
            x1="0"
            y1="0"
            x2="0"
            y2="4"
            style="stroke: var(--offsieve); stroke-width: 1.5"
          ></line>
        </pattern>
      </defs>
    </svg>
    <div class="page" id="app">
      <p class="loading" id="loading">Loading run data&hellip;</p>
    </div>
    <aside class="drawer" id="drawer" aria-label="Lab notebook" aria-hidden="true"></aside>
    <div class="tip" id="tip" role="tooltip" hidden></div>
    <!-- prettier-ignore -->
    <script id="viz-data" type="application/json">__VIZ_DATA__</script>
    <script>
      (() => {
        "use strict";

        const PLACEHOLDER = "__VIZ" + "_DATA__";
        const SVG_NS = "http://www.w3.org/2000/svg";
        const THEME_KEY = "nsl-viz-theme";
        const CAPABILITIES = [
          "inspect_evidence",
          "run_python",
          "record_evidence_plan",
          "record_hypothesis",
          "compile_feature",
          "probe_feature",
          "finalize_feature",
          "abandon_feature",
          "submit_hypothesis",
          "get_accepted_hypothesis",
          "submit_rewrite",
        ];
        const CAT_SLOTS = 8;
        const GEN_LIGHT = [
          "#86b6ef",
          "#6da7ec",
          "#5598e7",
          "#3987e5",
          "#2a78d6",
          "#256abf",
          "#1c5cab",
          "#184f95",
          "#104281",
          "#0d366b",
        ];
        const GEN_DARK = [
          "#184f95",
          "#1c5cab",
          "#256abf",
          "#2a78d6",
          "#3987e5",
          "#5598e7",
          "#6da7ec",
          "#86b6ef",
          "#9ec5f4",
          "#b7d3f6",
          "#cde2fb",
        ];
        const STAGE_LIGHT = [
          "#fe9670",
          "#f37a4d",
          "#dd6639",
          "#c65222",
          "#b13e02",
          "#943302",
          "#782802",
          "#5d1d01",
          "#441200",
        ];
        const STAGE_DARK = [
          "#8b2f01",
          "#a73a01",
          "#bf4b1a",
          "#d56031",
          "#eb7446",
          "#fe8b60",
          "#ffac8e",
          "#fecbb8",
          "#fee7df",
        ];
        const OFF_SIEVE_GLYPH = new Map([
          ["crash", "\u2715"],
          ["error", "!"],
          ["incomplete", "?"],
          ["pending", "\u2026"],
        ]);
        const offSieveGlyph = (id) => OFF_SIEVE_GLYPH.get(id) || "\u00b7";
        const NOTEBOOK_PAGE = 100;
        const SEQ_BINS = 7;

        const arr = (v) => (Array.isArray(v) ? v : []);
        const num = (v) => (typeof v === "number" && Number.isFinite(v) ? v : null);
        const str = (v) => (v === null || v === undefined ? "" : String(v));
        const shortId = (id) => str(id).slice(0, 8);
        const plural = (n, one, many) => `${n} ${n === 1 ? one : many || one + "s"}`;

        function applyProps(node, props) {
          if (!props) return;
          for (const [key, value] of Object.entries(props)) {
            if (value === null || value === undefined || value === false) continue;
            if (key === "text") node.textContent = String(value);
            else if (key === "on") {
              for (const [type, fn] of Object.entries(value)) node.addEventListener(type, fn);
            } else if (/^on/i.test(key)) {
              throw new Error("event attributes are not allowed");
            } else node.setAttribute(key, value === true ? "" : String(value));
          }
        }
        function appendKids(node, kids) {
          for (const kid of kids.flat(Infinity)) {
            if (kid === null || kid === undefined || kid === false) continue;
            node.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
          }
          return node;
        }
        const el = (tag, props, ...kids) => {
          const node = document.createElement(tag);
          applyProps(node, props);
          return appendKids(node, kids);
        };
        const fill = (node, ...kids) => {
          node.replaceChildren();
          return appendKids(node, kids);
        };
        const sv = (tag, props, ...kids) => {
          const node = document.createElementNS(SVG_NS, tag);
          applyProps(node, props);
          return appendKids(node, kids);
        };

        function fmt(v, sig = 3) {
          const x = num(v);
          if (x === null) return "\u2013";
          if (x === 0) return "0";
          const a = Math.abs(x);
          let out;
          if (a >= 1000) out = Math.round(a).toLocaleString("en-US");
          else if (a >= 1) out = String(Number(a.toFixed(2)));
          else if (a < 1e-4) out = a.toExponential(1);
          else out = String(Number(a.toPrecision(sig)));
          return (x < 0 ? "\u2212" : "") + out;
        }
        const pct = (v) => `${Math.round(v * 100)}%`;
        function fmtTime(seconds) {
          const x = num(seconds);
          if (x === null) return "\u2013";
          return new Date(x * 1000).toISOString().slice(0, 16).replace("T", " ") + " UTC";
        }
        function fmtIso(iso) {
          const d = new Date(str(iso));
          if (Number.isNaN(d.getTime())) return str(iso);
          return d.toISOString().slice(0, 16).replace("T", " ") + " UTC";
        }
        const breakable = (name) => str(name).replace(/_/g, "_\u200b");

        function mixHex(a, b, t) {
          const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16));
          const pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
          return (
            "#" +
            pa
              .map((v, i) =>
                Math.round(v + (pb[i] - v) * t)
                  .toString(16)
                  .padStart(2, "0"),
              )
              .join("")
          );
        }
        function rampStep(ramp, i, n, single) {
          if (n <= 1) return ramp[single];
          const t = (i * (ramp.length - 1)) / (n - 1);
          if (n <= ramp.length) return ramp[Math.round(t)];
          const lo = Math.floor(t);
          const hi = Math.min(ramp.length - 1, lo + 1);
          return mixHex(ramp[lo], ramp[hi], t - lo);
        }

        async function loadDocument() {
          const node = document.getElementById("viz-data");
          const raw = node ? node.textContent.trim() : "";
          if (raw && raw !== PLACEHOLDER) return JSON.parse(raw);
          const response = await fetch("viz.json", { cache: "no-store" });
          if (!response.ok) throw new Error(`viz.json: HTTP ${response.status}`);
          return response.json();
        }

        function buildModel(doc) {
          const stages = arr(doc.stages).map((s) => ({
            id: str(s && s.id),
            label: str(s && (s.label ?? s.id)),
            sieve: Boolean(s && s.sieve),
          }));
          const stageById = new Map(stages.map((s) => [s.id, s]));
          if (!stageById.has("admitted")) {
            const s = { id: "admitted", label: "Admitted", sieve: true };
            stages.push(s);
            stageById.set(s.id, s);
          }
          const episodes = arr(doc.episodes)
            .filter((e) => e && typeof e === "object")
            .map((e) => ({
              ...e,
              key: str(e.key),
              generation: num(e.generation) ?? 0,
              episode_index: num(e.episode_index) ?? 0,
              stage: str(e.stage) || "error",
              admitted: e.admitted === true,
              inputs: Array.isArray(e.inputs) ? e.inputs.map(str) : null,
              parents: Array.isArray(e.parents) ? e.parents.map(str) : null,
              claimed_parents: arr(e.claimed_parents).map(str),
            }));
          for (const ep of episodes) {
            if (ep.admitted) ep.stage = "admitted";
            if (!stageById.has(ep.stage)) {
              const s = { id: ep.stage, label: ep.stage, sieve: false };
              stages.push(s);
              stageById.set(s.id, s);
            }
          }
          const stops = stages.filter((s) => s.sieve && s.id !== "admitted");
          const sieve = [...stops, stageById.get("admitted")];
          const rank = new Map(sieve.map((s, i) => [s.id, i]));
          const stopIndex = new Map(stops.map((s, i) => [s.id, i]));
          const offSieve = stages.filter((s) => !s.sieve);

          const gens = [
            ...new Set([
              ...arr(doc.generations)
                .map(num)
                .filter((g) => g !== null),
              ...episodes.map((e) => e.generation),
            ]),
          ].sort((a, b) => a - b);
          const genIndex = new Map(gens.map((g, i) => [g, i]));
          episodes.sort(
            (a, b) =>
              genIndex.get(a.generation) - genIndex.get(b.generation) ||
              a.episode_index - b.episode_index,
          );
          const byKey = new Map(episodes.map((e) => [e.key, e]));

          const rules = arr(doc.rules)
            .filter((r) => r && r.rule_id)
            .map((r) => ({
              ...r,
              rule_id: str(r.rule_id),
              revision: num(r.revision) ?? 0,
              generation: num(r.generation) ?? 0,
              episode_key: str(r.episode_key),
              inputs: Array.isArray(r.inputs) ? r.inputs.map(str) : null,
              parents: Array.isArray(r.parents) ? r.parents.map(str) : null,
              stage2_gain: num(r.stage2_gain),
            }))
            .sort((a, b) => a.revision - b.revision);
          for (const r of rules) {
            if (!genIndex.has(r.generation)) {
              gens.push(r.generation);
              gens.sort((a, b) => a - b);
              gens.forEach((g, i) => genIndex.set(g, i));
            }
          }
          const ruleById = new Map(rules.map((r) => [r.rule_id, r]));
          const ruleByEpisode = new Map(rules.map((r) => [r.episode_key, r]));
          const ruleRank = new Map(rules.map((r, i) => [r.rule_id, i]));
          const edges = arr(doc.edges)
            .filter((e) => e && e.parent && e.child)
            .map((e) => ({
              parent: str(e.parent),
              child: str(e.child),
              kind: e.kind === "claimed" ? "claimed" : "trusted",
            }));

          const scored = episodes
            .filter((e) => e.score && num(e.score.stage2_lower_bound) !== null)
            .map((e, i) => ({ e, i }))
            .sort(
              (a, b) =>
                (num(a.e.committed_at) ?? Infinity) - (num(b.e.committed_at) ?? Infinity) ||
                a.i - b.i,
            )
            .map((x) => x.e);
          const unscorable = episodes.filter(
            (e) => e.score && num(e.score.stage2_lower_bound) === null,
          ).length;

          const inputsDoc = doc.inputs && typeof doc.inputs === "object" ? doc.inputs : {};
          const descriptors = arr(inputsDoc.descriptors)
            .filter((d) => d && d.name)
            .map((d) => ({
              name: str(d.name),
              family: str(d.family),
              unit: str(d.unit),
              value_type: str(d.value_type),
            }));
          const descByName = new Map(descriptors.map((d) => [d.name, d]));
          const groups = arr(inputsDoc.groups)
            .filter((g) => g)
            .map((g) => ({
              id: str(g.id),
              label: str(g.label ?? g.id),
              inputs: arr(g.inputs).map(str),
            }));
          const placed = new Set(groups.flatMap((g) => g.inputs));
          const extra = new Set(descriptors.map((d) => d.name).filter((n) => !placed.has(n)));
          for (const e of episodes)
            for (const n of e.inputs || []) if (!placed.has(n)) extra.add(n);
          for (const r of rules) for (const n of r.inputs || []) if (!placed.has(n)) extra.add(n);
          if (extra.size)
            groups.push({
              id: "__other",
              label: "not in registry groups",
              inputs: [...extra].sort(),
            });

          return {
            doc,
            stages,
            stageById,
            stops,
            sieve,
            rank,
            stopIndex,
            offSieve,
            gens,
            genIndex,
            episodes,
            byKey,
            rules,
            ruleById,
            ruleByEpisode,
            ruleRank,
            edges,
            scored,
            unscorable,
            descriptors,
            descByName,
            groups,
            grouping: str(inputsDoc.grouping),
            sources: doc.sources && typeof doc.sources === "object" ? doc.sources : {},
          };
        }

        function injectColorTokens(model) {
          const n = model.gens.length;
          const m = model.stops.length;
          const light = [];
          const dark = [];
          model.gens.forEach((g, i) => {
            light.push(`--gen-${i}:${rampStep(GEN_LIGHT, i, n, 5)}`);
            dark.push(`--gen-${i}:${rampStep(GEN_DARK, i, n, 5)}`);
          });
          model.stops.forEach((s, j) => {
            light.push(`--stage-${j}:${rampStep(STAGE_LIGHT, j, m, 4)}`);
            dark.push(`--stage-${j}:${rampStep(STAGE_DARK, j, m, 4)}`);
          });
          const style = document.createElement("style");
          style.textContent =
            `:root{${light.join(";")}}` +
            `@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){${dark.join(";")}}}` +
            `:root[data-theme="dark"]{${dark.join(";")}}`;
          document.head.appendChild(style);
        }

        let model;
        const state = {
          gens: new Set(),
          input: null,
          rule: null,
          episode: null,
          showRejected: false,
          notebookLimit: NOTEBOOK_PAGE,
        };
        const genVar = (g) => `var(--gen-${model.genIndex.get(g) ?? 0})`;
        const genOn = (g) => state.gens.has(g);
        function stageColor(id) {
          if (id === "admitted") return "var(--good)";
          if (model.stopIndex.has(id)) return `var(--stage-${model.stopIndex.get(id)})`;
          return "url(#hatch)";
        }
        const stageLabel = (id) => (model.stageById.get(id) || { label: id }).label;
        const isOffSieve = (id) => !model.rank.has(id);
        const journalOnly = (e) => e.stage === "crash" || e.stage === "pending";
        function causeOf(e) {
          if (e.stop_cause) return str(e.stop_cause);
          const j = journalOnly(e) && e.journal && typeof e.journal === "object" ? e.journal : {};
          const found = [
            j.termination_category === "success" ? null : j.termination_category,
            j.budget_exhausted_kind,
            j.error_category,
          ].find((v) => typeof v === "string" && v);
          return found || null;
        }
        const capSlot = (name) => {
          const i = CAPABILITIES.indexOf(name);
          return i >= 0 && i < CAT_SLOTS ? i + 1 : null;
        };

        const tip = document.getElementById("tip");
        function placeTip(x, y) {
          const pad = 12;
          const w = tip.offsetWidth;
          const h = tip.offsetHeight;
          let left = x + 14;
          let top = y + 14;
          if (left + w + pad > window.innerWidth) left = Math.max(pad, x - w - 14);
          if (top + h + pad > window.innerHeight) top = Math.max(pad, y - h - 14);
          tip.style.left = `${left}px`;
          tip.style.top = `${top}px`;
        }
        function showTip(content, x, y) {
          fill(
            tip,
            el("div", { class: "tip-title", text: content.title }),
            ...content.rows.map(([value, label]) =>
              el(
                "div",
                { class: "tip-row" },
                el("strong", { text: value }),
                el("span", { text: label }),
              ),
            ),
          );
          tip.hidden = false;
          placeTip(x, y);
        }
        const hideTip = () => {
          tip.hidden = true;
        };
        let restoringFocus = false;
        function keepFocus(render) {
          const active = document.activeElement;
          const key = active && active.dataset ? active.dataset.key : undefined;
          render();
          if (!key || (active.isConnected && document.activeElement === active)) return;
          const next = document.querySelector(`[data-key="${CSS.escape(key)}"]`);
          if (!next) return;
          restoringFocus = true;
          try {
            next.focus({ preventScroll: true });
          } finally {
            restoringFocus = false;
          }
        }
        const rovingMemory = new Map();
        function rovingFocus(container, items, memoryKey) {
          const index = new Map(items.map((node, i) => [node, i]));
          const remembered = rovingMemory.get(memoryKey);
          let current = items.find((node) => node.dataset.key === remembered) || items[0];
          for (const node of items) node.setAttribute("tabindex", node === current ? 0 : -1);
          container.addEventListener("focusin", (ev) => {
            if (!index.has(ev.target) || ev.target === current) return;
            current.setAttribute("tabindex", -1);
            current = ev.target;
            current.setAttribute("tabindex", 0);
            rovingMemory.set(memoryKey, current.dataset.key);
          });
          container.addEventListener("keydown", (ev) => {
            const i = index.get(ev.target);
            if (i === undefined) return;
            const last = items.length - 1;
            const moves = { ArrowRight: i + 1, ArrowLeft: i - 1, Home: 0, End: last };
            if (!(ev.key in moves)) return;
            ev.preventDefault();
            items[Math.max(0, Math.min(last, moves[ev.key]))].focus();
          });
        }
        function bindTip(node, contentFn, onActivate) {
          node.addEventListener("pointerenter", (ev) => {
            if (ev.pointerType === "mouse" || ev.pointerType === "pen")
              showTip(contentFn(), ev.clientX, ev.clientY);
          });
          node.addEventListener("pointermove", (ev) => {
            if (!tip.hidden) placeTip(ev.clientX, ev.clientY);
          });
          node.addEventListener("pointerleave", hideTip);
          node.addEventListener("focus", () => {
            if (restoringFocus) return;
            const r = node.getBoundingClientRect();
            showTip(contentFn(), r.right, r.top + r.height / 2);
          });
          node.addEventListener("blur", hideTip);
          if (onActivate) {
            node.addEventListener("click", (ev) => {
              ev.stopPropagation();
              hideTip();
              onActivate();
            });
            node.addEventListener("keydown", (ev) => {
              if (ev.key === "Enter" || ev.key === " ") {
                ev.preventDefault();
                hideTip();
                onActivate();
              }
            });
          }
        }

        function emptyState(title, detail) {
          return el(
            "div",
            { class: "empty", role: "status" },
            el("strong", { text: title }),
            detail || null,
          );
        }
        function table(caption, headers, rows) {
          return el(
            "div",
            { class: "table-wrap" },
            el(
              "table",
              null,
              el("caption", { text: caption }),
              el(
                "thead",
                null,
                el(
                  "tr",
                  null,
                  headers.map((h) =>
                    el("th", {
                      scope: "col",
                      class: h.n ? "n" : null,
                      text: h.label,
                    }),
                  ),
                ),
              ),
              el(
                "tbody",
                null,
                rows.map((row) =>
                  el(
                    "tr",
                    null,
                    row.map((cell, i) =>
                      el("td", {
                        class:
                          [
                            headers[i].n ? "n" : headers[i].mono ? "mono" : "",
                            headers[i].wide ? "wide" : "",
                          ]
                            .join(" ")
                            .trim() || null,
                        text: cell,
                      }),
                    ),
                  ),
                ),
              ),
            ),
          );
        }
        function legendItem(swatch, label) {
          return el("span", { class: "item" }, swatch, el("span", { text: label }));
        }
        const swatch = (color, extra) =>
          el("span", { class: "swatch", style: `background:${color};${extra || ""}` });
        function lineKey(dash) {
          return sv(
            "svg",
            { width: 22, height: 10, "aria-hidden": "true" },
            sv("line", {
              x1: 1,
              y1: 5,
              x2: 21,
              y2: 5,
              style: `stroke:var(--edge);stroke-width:1.5;${dash ? "stroke-dasharray:4 3;opacity:.7" : ""}`,
            }),
          );
        }
        function genLegend() {
          return [
            el("span", { class: "title", text: "Generation" }),
            model.gens.map((g) =>
              legendItem(
                el("span", { class: "dot", style: `background:${genVar(g)}` }),
                `Gen ${g}`,
              ),
            ),
          ];
        }
        function stageRampLegend(title) {
          if (!model.stops.length) return null;
          return el(
            "span",
            { class: "item" },
            el("span", { class: "title", text: title }),
            el("span", { text: model.stops[0].label }),
            el(
              "span",
              { class: "ramp" },
              model.stops.map((s) => swatch(stageColor(s.id))),
            ),
            el("span", { text: model.stops[model.stops.length - 1].label }),
          );
        }
        function checkIcon(cls) {
          return sv(
            "svg",
            {
              class: cls || "ico",
              viewBox: "0 0 12 12",
              width: 12,
              height: 12,
              "aria-hidden": "true",
            },
            sv("circle", { cx: 6, cy: 6, r: 6, style: "fill:var(--good)" }),
            sv("path", {
              d: "M3.2 6.2 5.1 8 8.8 4.2",
              style:
                "fill:none;stroke:#ffffff;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round",
            }),
          );
        }
        function stageBadge(id) {
          if (id === "admitted") {
            return el(
              "span",
              { class: "badge good" },
              checkIcon(),
              el("span", { text: stageLabel(id) }),

            ? el("span", {

          return el(
            "span",
            { class: "badge" },
            icon,
            el("span", { text: isOffSieve(id) ? stageLabel(id) : `Stopped: ${stageLabel(id)}` }),
          );
        }

        const panels = {};
        function makePanel(id, title, subtitle) {
          const toggle = el("button", {
            class: "btn",
            type: "button",
            "aria-pressed": "false",
            text: "Table",
          });
          const chart = el("div", { class: "panel-body", "data-view": "chart" });
          const tableBox = el("div", { class: "panel-body", "data-view": "table", hidden: true });
          const legend = el("div", { class: "legend" });
          const note = el("div", { class: "note", hidden: true });

            "section",

              el(
                "div",

                el("p", { text: subtitle }),

          toggle.addEventListener("click", () => {

            chart.hidden = showTable;
            legend.hidden = showTable;
            tableBox.hidden = !showTable;
            if (showTable) flushTable(panels[id]);
          });
          panels[id] = { section, chart, table: tableBox, legend, note, buildTable: null };
          return section;
        }
        function setTable(panel, build) {
          panel.buildTable = build;
          if (!panel.table.hidden) flushTable(panel);
        }
        function flushTable(panel) {
          const build = panel.buildTable;
          panel.buildTable = null;
          if (build) fill(panel.table, build());
        }
        function setNote(panel, text) {

        function keepScroll(container, fn) {
          const scroller = container.querySelector(".scroller");

          if (next) next.scrollLeft = left;
        }
        const availWidth = (panel) =>
          Math.max(240, panel.chart.clientWidth || panel.section.clientWidth - 32);

        function buildPage() {
          const doc = model.doc;
          const src = model.sources;
          const fields =
            src.fields_not_recorded && typeof src.fields_not_recorded === "object"
              ? src.fields_not_recorded
              : {};
          const gaps = [];
          if (num(src.journal_only))
            gaps.push(`${plural(src.journal_only, "episode")} with no outcome row (journal only)`);
          if (num(src.missing_blobs))
            gaps.push(
              `${plural(src.missing_blobs, "blob")} missing or corrupt (scores unavailable)`,
            );
          const missingFields = Object.entries(fields)
            .filter(([, v]) => num(v))
            .map(
              ([k, v]) =>
                `${k} for ${plural(v, "episode")}${k === "inputs" ? " (recovered from expressions)" : ""}`,
            );
          if (missingFields.length)
            gaps.push(`not recorded by this archive: ${missingFields.join(", ")}`);

          const gensText = model.gens.length
            ? `${plural(model.gens.length, "generation")} (${model.gens[0]}\u2013${model.gens[model.gens.length - 1]})`
            : "no generations yet";
          const runs = arr(doc.runs_available);
          const themeBtn = el("button", { class: "btn", type: "button", id: "theme-toggle" });
          const notebookBtn = el(
            "button",
            {
              class: "btn",
              type: "button",
              id: "notebook-toggle",
              "aria-expanded": "false",
              "aria-controls": "drawer",
            },
            el("span", { text: "Lab notebook" }),
            el("span", {
              class: "count",
              id: "notebook-count",
              title: "admitted rules in this run",
            }),
          );
          const header = el(
            "header",

                el("span", { text: `generated ${fmtIso(doc.generated_at)}` }),

                  ? el("span", { text: `${runs.length} runs in this archive` })
                  : null,
              ),
            ),
            el("div", { class: "actions" }, themeBtn, notebookBtn),
          );
          const notice = gaps.length
            ? el(
                "p",
                { class: "notice", role: "note" },
                el("span", { class: "icon", "aria-hidden": "true", text: "!" }),
                el("span", null, el("strong", { text: "Data gaps. " }), `${gaps.join("; ")}.`),
              )
            : null;
          const chips = el("nav", {
            class: "chips",
            id: "chips",
            "aria-label": "Generation filter",
          });
          const main = el(
            "main",
            null,
            el(
              "div",
              { class: "row row-a" },
              makePanel(
                "coverage",
                "Input coverage",
                "One cell per input variable. Darker cells carry more stage-2 gain from admitted rules; blank cells are inputs no rule has used yet.",
              ),
              makePanel(
                "lineage",
                "Lineage",
                "Admitted rules by archive revision (left to right) and generation (lanes). Lines join each rule to its assigned parents; the stub under a parent counts its rejected offspring by stopping stage.",
              ),
            ),
            el(
              "div",
              { class: "row row-b" },
              makePanel(
                "rising",
                "Rising bar",
                "Every scored submission in order. Admission needs the stage-2 lower bound above 0; each whisker reaches up to the point estimate.",
              ),
              makePanel(
                "process",
                "Process fingerprint",
                "How each generation spent its tool calls, how soon a feature first compiled, and how probes were used. Panels share scales.",
              ),
            ),
            makePanel(
              "sieve",
              "Sieve barcode",
              "One column per episode and one row per pipeline stage. Gray cells are stages passed, the coloured cell is where the episode stopped, and a green check marks admission.",
            ),
          );
          const app = document.getElementById("app");
          fill(app, header, notice, chips, main);
          buildDrawer();
          setupTheme(themeBtn);
          notebookBtn.addEventListener("click", () =>
            setDrawer(!document.body.classList.contains("drawer-open")),

        function setupTheme(button) {
          const root = document.documentElement;
          const media = window.matchMedia
            ? window.matchMedia("(prefers-color-scheme: dark)")
            : null;
          try {
            const saved = window.localStorage.getItem(THEME_KEY);
            if (saved === "light" || saved === "dark") root.dataset.theme = saved;
          } catch (err) {
            /* storage unavailable */
          }
          const effective = () => root.dataset.theme || (media && media.matches ? "dark" : "light");
          const label = () => {
            const next = effective() === "dark" ? "light" : "dark";
            fill(
              button,
              el("span", { "aria-hidden": "true", text: next === "dark" ? "\u263e" : "\u2600" }),
              el("span", { text: next === "dark" ? "Dark" : "Light" }),
            );
            button.setAttribute("aria-label", `Switch to ${next} theme`);
          };
          button.addEventListener("click", () => {
            const next = effective() === "dark" ? "light" : "dark";
            root.dataset.theme = next;
            try {
              window.localStorage.setItem(THEME_KEY, next);
            } catch (err) {
              /* storage unavailable */
            }
            label();
          });
          if (media && media.addEventListener) media.addEventListener("change", label);
          label();
        }

        function renderChips() {
          const chips = document.getElementById("chips");
          const all = state.gens.size === model.gens.length;
          const counts = new Map(model.gens.map((g) => [g, 0]));
          for (const e of model.episodes)
            counts.set(e.generation, (counts.get(e.generation) || 0) + 1);
          const allChip = el("button", {
            class: "chip",
            type: "button",
            "data-key": "gen:all",
            "aria-pressed": String(all),
            text: "All",
          });
          allChip.addEventListener("click", () => {
            state.gens = new Set(model.gens);

          });
          const genChips = model.gens.map((g) => {
            const chip = el(
              "button",
              {
                class: "chip",
                type: "button",
                "data-key": `gen:${g}`,
                "aria-pressed": String(!all && genOn(g)),
              },

              el("span", { class: "n", text: counts.get(g) || 0 }),
            );
            chip.addEventListener("click", () => {
              if (all) state.gens = new Set([g]);
              else if (genOn(g)) state.gens.delete(g);

            });

          });

                  type: "button",

                }),
              )
            : null;

            el("span", { class: "label", text: "Generations" }),
            el(
              "div",
              { class: "chip-row" },
              allChip,

              model.gens.length ? null : el("span", { class: "label", text: "none yet" }),

        }

        function setInput(name) {
          state.input = name;
          renderAll();
        }
        function toggleInput(name) {
          if (state.input === name) {
            setInput(null);
            return;
          }
          state.input = name;
          state.rule = null;
          state.episode = null;
          renderAll();
          setDrawer(true);
        }
        function openRule(ruleId) {
          state.rule = ruleId;
          state.episode = null;
          renderAll();
          setDrawer(true);
        }
        function openEpisode(key) {
          state.episode = key;
          state.rule = null;
          renderAll();
          setDrawer(true);
        }

        function coverageStats() {
          const stats = new Map();
          const get = (n) => {
            if (!stats.has(n)) stats.set(n, { gain: 0, rules: 0, rejected: 0, gainAll: 0 });
            return stats.get(n);
          };
          for (const g of model.groups) for (const n of g.inputs) get(n);
          for (const r of model.rules) {
            for (const n of new Set(r.inputs || [])) {
              const s = get(n);
              s.gainAll += Math.max(0, r.stage2_gain ?? 0);
              if (genOn(r.generation)) {
                s.gain += Math.max(0, r.stage2_gain ?? 0);
                s.rules += 1;
              }
            }
          }
          for (const e of model.episodes) {
            if (e.admitted || !e.inputs || !genOn(e.generation)) continue;
            for (const n of new Set(e.inputs)) get(n).rejected += 1;
          }
          let max = 0;
          for (const s of stats.values()) max = Math.max(max, s.gainAll);
          return { stats, max };
        }
        const seqBin = (v, max) =>
          v <= 0 || max <= 0 ? 0 : Math.min(SEQ_BINS, Math.max(1, Math.ceil((v / max) * SEQ_BINS)));

        function renderCoverage() {
          const p = panels.coverage;
          const { stats, max } = coverageStats();
          const names = model.groups.flatMap((g) => g.inputs);
          if (!names.length) {
            fill(
              p.chart,
              emptyState(
                "No input registry in this document",
                "The extractor found no descriptors, so there is nothing to lay out.",
              ),
            );
            fill(p.legend);
            setTable(p, () => emptyState("No inputs"));
            setNote(p, "");
            return;
          }
          const blocks = model.groups
            .filter((g) => g.inputs.length)
            .map((g) =>
              el(
                "div",
                { class: "cov-group" },
                el(
                  "div",
                  { class: "cov-group-label" },
                  el("b", { text: g.label }),
                  ` \u00b7 ${g.inputs.length}`,
                ),
                el(
                  "div",
                  { class: "cov-cells" },
                  g.inputs.map((name) => {
                    const s = stats.get(name);
                    const bin = seqBin(s.gain, max);
                    const cls = [
                      "cov-cell",
                      bin || s.rules ? "" : s.rejected ? "rejected-only" : "untouched",
                      state.input && state.input !== name ? "faded" : "",
                    ]
                      .filter(Boolean)
                      .join(" ");
                    const cell = el(
                      "button",
                      {
                        type: "button",
                        class: cls,
                        "data-key": `input:${name}`,
                        "data-bin": bin || null,
                        "aria-pressed": String(state.input === name),
                        "aria-label": `${name}: ${plural(s.rules, "admitted rule")}, summed stage-2 gain ${fmt(s.gain)}, ${plural(s.rejected, "rejected episode")}`,
                      },
                      el("span", { class: "nm", text: breakable(name) }),
                      el("span", {
                        class: "ct",
                        text: s.rules
                          ? plural(s.rules, "rule")
                          : s.rejected
                            ? `0 rules \u00b7 ${s.rejected} rejected`
                            : "untouched",
                      }),
                    );
                    bindTip(
                      cell,
                      () => {
                        const d = model.descByName.get(name);
                        return {
                          title: name,
                          rows: [
                            [fmt(s.gain), "summed stage-2 gain (admitted)"],
                            [String(s.rules), "admitted rules"],
                            [String(s.rejected), "rejected episodes using it"],
                            ...(d
                              ? [
                                  [
                                    d.unit || "\u2013",
                                    d.family ? `unit \u00b7 family ${d.family}` : "unit",
                                  ],
                                ]
                              : []),
                          ],
                        };
                      },
                      () => toggleInput(name),
                    );
                    return cell;
                  }),
                ),
              ),
            );
          fill(p.chart, el("div", { class: "cov" }, blocks));
          fill(
            p.legend,
            el(
              "span",
              { class: "item" },
              el("span", { class: "title", text: "Summed stage-2 gain" }),
              el("span", { class: "num", text: "0" }),
              el(
                "span",
                { class: "ramp" },
                Array.from({ length: SEQ_BINS }, (_, i) => swatch(`var(--seq-${i + 1})`)),
              ),
              el("span", { text: max > 0 ? fmt(max) : "no admitted gain yet" }),
            ),
            legendItem(
              swatch("transparent", "border:1.5px dashed var(--muted)"),
              "used only by rejected episodes",
            ),
            legendItem(swatch("transparent", "border:1px solid var(--grid)"), "untouched"),
          );
          const rejectedOnly = names.filter(
            (n) => !stats.get(n).rules && stats.get(n).rejected,
          ).length;
          const untouched = names.filter(
            (n) => !stats.get(n).rules && !stats.get(n).rejected,
          ).length;
          const admittedIn = model.rules.filter((r) => genOn(r.generation)).length;
          setNote(
            p,
            admittedIn
              ? `${names.length - rejectedOnly - untouched} of ${names.length} inputs used by admitted rules; ${rejectedOnly} only by rejected episodes; ${untouched} untouched.${state.input ? " Click the selected cell again or press Esc to clear." : ""}`
              : "No admitted rules in the selected generations yet, so no cell is filled.",
          );
          setTable(p, () => [
            table(
              "Input coverage (selected generations)",
              [
                { label: "Group" },
                { label: "Input", mono: true },
                { label: "Unit" },
                { label: "Admitted rules", n: true },
                { label: "Summed stage-2 gain", n: true },
                { label: "Rejected episodes", n: true },
              ],
              model.groups.flatMap((g) =>
                g.inputs.map((n) => {
                  const s = stats.get(n);
                  const d = model.descByName.get(n);
                  return [
                    g.label,
                    n,
                    d ? d.unit : "",
                    String(s.rules),
                    fmt(s.gain),
                    String(s.rejected),
                  ];
                }),
              ),
            ),
          ]);
        }

        function lineageData() {
          const trusted = new Set(
            model.edges.filter((e) => e.kind === "trusted").map((e) => `${e.parent}|${e.child}`),
          );
          const solid = [];
          const dashed = [];
          const stubs = new Map();
          let external = 0;
          for (const e of model.edges) {
            const parent = model.ruleById.get(e.parent);
            if (!parent) {
              if (e.kind === "trusted") external += 1;
              continue;
            }
            const childRule = model.ruleByEpisode.get(e.child);
            const child = model.byKey.get(e.child);
            if (e.kind === "trusted") {
              if (childRule) solid.push({ parent, child: childRule });
              else if (child && !child.admitted && genOn(child.generation)) {
                if (!stubs.has(parent.rule_id)) stubs.set(parent.rule_id, new Map());
                const m = stubs.get(parent.rule_id);
                m.set(child.stage, (m.get(child.stage) || 0) + 1);
              }
            } else if (childRule && !trusted.has(`${e.parent}|${e.child}`)) {
              dashed.push({ parent, child: childRule });
            }
          }
          return { solid, dashed, stubs, external };
        }
        function stubOrder(m) {
          const order = [...model.stops.map((s) => s.id), ...model.offSieve.map((s) => s.id)];
          return order.filter((id) => m.has(id)).map((id) => [id, m.get(id)]);
        }

        function renderLineage() {
          const p = panels.lineage;
          const rules = model.rules;
          if (!rules.length) {
            fill(
              p.chart,
              emptyState(
                "No admitted rules yet",
                "Nodes appear here once a rule passes both gates, is unique, and is admitted to the archive.",
              ),
            );
            fill(p.legend);
            setTable(p, () => emptyState("No admitted rules yet"));
            setNote(p, "");
            return;
          }
          const { solid, dashed, stubs, external } = lineageData();
          const laneH = 88;
          const nodeY = 34;
          const left = 64;
          const top = 28;
          const spacing = 48;
          const gains = rules.map((r) => Math.max(0, r.stage2_gain ?? 0));
          const gmax = Math.max(...gains, 0);
          const radius = (r) =>
            gmax > 0 ? 4 + 10 * Math.sqrt(Math.max(0, r.stage2_gain ?? 0) / gmax) : 4;
          const width = Math.max(availWidth(p), left + rules.length * spacing + 24);
          const height = top + model.gens.length * laneH + 4;
          const x = (r) => left + spacing / 2 + model.ruleRank.get(r.rule_id) * spacing;
          const y = (r) => top + (model.genIndex.get(r.generation) ?? 0) * laneH + nodeY;
          const active = (r) =>
            genOn(r.generation) && (!state.input || (r.inputs || []).includes(state.input));
          const svg = sv("svg", {
            width,
            height,
            viewBox: `0 0 ${width} ${height}`,
            role: "img",
            "aria-label": `Lineage of ${plural(rules.length, "admitted rule")} across ${plural(model.gens.length, "generation")}`,
          });
          model.gens.forEach((g, i) => {
            const y0 = top + i * laneH;
            svg.append(sv("line", { class: "gridline", x1: 0, x2: width, y1: y0, y2: y0 }));
            svg.append(sv("circle", { cx: 10, cy: y0 + nodeY, r: 4, style: `fill:${genVar(g)}` }));
            svg.append(
              sv("text", {
                x: 20,
                y: y0 + nodeY + 4,
                class: genOn(g) ? "" : "muted",
                text: `Gen ${g}`,
              }),
            );
          });
          svg.append(
            sv("line", { class: "gridline", x1: 0, x2: width, y1: height - 4, y2: height - 4 }),
          );
          const labelEvery = Math.max(1, Math.ceil(32 / spacing));
          rules.forEach((r, i) => {
            if (i % labelEvery && i !== rules.length - 1) return;
            svg.append(
              sv("text", {
                x: x(r),
                y: 14,
                "text-anchor": "middle",
                class: "muted num",
                text: `r${r.revision}`,
              }),
            );
          });
          const curve = (a, b) => {
            const x1 = x(a),
              y1 = y(a),
              x2 = x(b),
              y2 = y(b);
            const dx = Math.max(16, (x2 - x1) / 2);
            if (y1 === y2 && x2 - x1 > spacing * 1.5) {
              const lift = Math.min(26, 6 + ((x2 - x1) / spacing) * 4);
              return `M${x1} ${y1} C${x1 + dx / 2} ${y1 - lift} ${x2 - dx / 2} ${y2 - lift} ${x2} ${y2}`;
            }
            return `M${x1} ${y1} C${x1 + dx} ${y1} ${x2 - dx} ${y2} ${x2} ${y2}`;
          };
          const edgeLayer = sv("g", { "aria-hidden": "true" });
          for (const e of dashed) {
            edgeLayer.append(
              sv("path", {
                d: curve(e.parent, e.child),
                class: active(e.child) ? "" : "dim",
                style:
                  "fill:none;stroke:var(--edge);stroke-width:1.25;stroke-dasharray:4 3;opacity:.55",
              }),
            );
          }
          for (const e of solid) {
            const hl =
              state.rule && (state.rule === e.child.rule_id || state.rule === e.parent.rule_id);
            edgeLayer.append(
              sv("path", {
                d: curve(e.parent, e.child),
                class: active(e.child) ? "" : "dim",
                style: `fill:none;stroke:${hl ? "var(--text)" : "var(--edge)"};stroke-width:${hl ? 2 : 1.5};opacity:${hl ? 1 : 0.75};stroke-linecap:round`,
              }),
            );
          }
          svg.append(edgeLayer);
          const stubTotal = (m) => [...m.values()].reduce((a, c) => a + c, 0);
          const maxStub = Math.max(1, ...[...stubs.values()].map(stubTotal));
          const unit = Math.min(4, (laneH - nodeY - 14 - 10) / maxStub);
          for (const r of rules) {
            const m = stubs.get(r.rule_id);
            if (!m) continue;
            const parts = stubOrder(m);
            const total = stubTotal(m);

        function processData() {
          const per = new Map();
          for (const g of model.gens) {
            per.set(g, {
              episodes: 0,
              recorded: 0,
              calls: new Map(),
              first: new Array(9).fill(0),
              probes: new Array(4).fill(0),
              pcts: [],
            });
          }
          const seen = new Set();
          for (const e of model.episodes) {
            const d = per.get(e.generation);
            d.episodes += 1;
            const pr = e.process;
            if (!pr || typeof pr !== "object") continue;
            d.recorded += 1;
            for (const [k, v] of Object.entries(
              pr.calls && typeof pr.calls === "object" ? pr.calls : {},
            )) {
              const c = num(v) ?? 0;
              d.calls.set(k, (d.calls.get(k) || 0) + c);
              if (c > 0) seen.add(k);
            }
            const f = num(pr.first_compile_success_attempt);
            d.first[f === null ? 8 : Math.min(8, Math.max(1, Math.round(f))) - 1] += 1;
            d.probes[Math.min(3, Math.max(0, Math.round(num(pr.probes) ?? 0)))] += 1;
            for (const v of arr(pr.probe_percentiles)) if (num(v) !== null) d.pcts.push(v);
          }
          const known = CAPABILITIES.filter((c) => seen.has(c));
          const others = [...seen].filter((c) => !CAPABILITIES.includes(c)).sort();
          const order = [...known, ...others];
          let firstMax = 1;
          let probeMax = 1;
          for (const d of per.values()) {
            firstMax = Math.max(firstMax, ...d.first);
            probeMax = Math.max(probeMax, ...d.probes);
          }
          return { per, order, firstMax, probeMax };

            width,
            height: h,
            role: "img",
            "aria-label": `Tool-call mix, ${total} calls`,
          });
          if (!total) {
            svg.append(
              sv("rect", { x: 0, y: 0, width, height: h, rx: 4, style: "fill:var(--track)" }),
            );
            svg.append(sv("text", { x: 8, y: 17, class: "muted", text: "no calls recorded" }));
            return { svg, total };
          }
          const parts = [];
          let other = 0;
          const otherNames = [];
          for (const c of order) {
            const v = d.calls.get(c) || 0;
            if (!v) continue;
            const slot = capSlot(c);
            if (slot) parts.push({ name: c, v, slot });
            else {
              other += v;
              otherNames.push(c);
            }
          }
          if (other) parts.push({ name: "Other", v: other, slot: "other", detail: otherNames });
          const gap = 2;
          const usable = width - gap * (parts.length - 1);
          let xx = 0;
          for (const part of parts) {
            const w = Math.max(1, (part.v / total) * usable);
            const g = sv("g");
            g.append(
              sv("rect", {
                x: xx,
                y: 0,
                width: w,
                height: h,
                rx: Math.min(4, w / 2),
                style: `fill:var(--cat-${part.slot})`,
              }),
            );
            const label = pct(part.v / total);
            if (w >= label.length * 6.5 + 8) {
              g.append(
                sv("text", {
                  x: xx + 4,
                  y: 17,
                  class: "num",
                  style: `fill:var(--cat-ink-${part.slot})`,
                  text: label,
                }),
              );
            }
            const hit = sv("rect", { class: "hit", x: xx, y: 0, width: w, height: h });
            bindTip(hit, () => ({
              title: part.name === "Other" ? `Other (${part.detail.join(", ")})` : part.name,
              rows: [
                [String(part.v), "calls"],
                [pct(part.v / total), "of this generation's calls"],
              ],
            }));
            g.append(hit);
            svg.append(g);
            xx += w + gap;
          }
          return { svg, total };
        }
        function percentileStrip(values, width) {
          const left = 4,
            right = 4,
            h = 16,
            top = 2;
          const svg = sv("svg", {
            width,
            height: top + h + 16,
            role: "img",
            "aria-label": `${values.length} probe percentiles`,

          const x = (v) => left + (Math.max(0, Math.min(100, v)) / 100) * (width - left - right);
          svg.append(
            sv("line", {
              class: "baseline",
              x1: left,
              x2: width - right,
              y1: top + h,
              y2: top + h,
            }),
          );
          for (const v of values) {
            svg.append(
              sv("line", {
                x1: x(v),
                x2: x(v),
                y1: top,
                y2: top + h,
                style: "stroke:var(--text-2);stroke-width:1.5;opacity:.75",
              }),
            );
          }
          [0, 50, 100].forEach((t, i) =>
            svg.append(
              sv("text", {
                x: x(t),
                y: top + h + 13,

        function renderSieve() {
          const p = panels.sieve;

          const rows = model.sieve.length;

            colW = 8,

          const height = iconH + rows * rowH;
          const gens = model.gens.filter(genOn);

              width: midW,

            });

            const cell = (color, x, y, w, h) => {

              cells.get(color).push(`M${x} ${y}h${w}v${h}h${-w}z`);
            };
            const checks = [];
            const marks = [];
            const hits = eps.map((e, i) => {
              const x = i * pitch;
              const off = isOffSieve(e.stage);

              if (off) {
                cell("url(#hatch)", x, rowY(rows - 1), colW, rows * rowH - 2);
                marks.push(
                  sv("text", {

                  cell(fillColor, x, rowY(k), colW, cellH);

            sums.append(

            model.sieve.forEach((st, k) => {

                  x: sumW - 2,
                  y: rowY(k) + cellH - 1.5,
                  "text-anchor": "end",

            const admittedN = eps.filter((e) => e.admitted).length;
            const offN = eps.filter((e) => isOffSieve(e.stage)).length;
            return el(
              "div",
              { class: "sieve-gen" },
              el(
                "div",
                { class: "sieve-head" },

                }),

          const scrollers = p.chart.querySelectorAll(".scroller");
          const left = scrollers.length ? scrollers[0].scrollLeft : 0;
          fill(p.chart, gens.length ? blocks : emptyState("No generation selected"));
          const next = [...p.chart.querySelectorAll(".scroller")];
          next.forEach((sc) => {
            sc.scrollLeft = left;
            sc.addEventListener("scroll", () => {

          const offItems = model.offSieve
            .filter((s) => model.episodes.some((e) => e.stage === s.id))
            .map((s) =>
              legendItem(
                sv(
                  "svg",
                  { width: 12, height: 14, "aria-hidden": "true" },

                  sv("text", {

          fill(

                  }),

            el("div", { style: "height:12px" }),
            table(
              "Every episode",
              [
                { label: "Episode", mono: true },
                { label: "Gen", n: true },
                { label: "Index", n: true },
                { label: "Stage" },
                { label: "Stop cause" },
                { label: "Committed" },
              ],
              gens
                .flatMap((g) => byGen.get(g))
                .map((e) => [
                  e.key,
                  String(e.generation),
                  String(e.episode_index),
                  stageLabel(e.stage),
                  causeOf(e) || "\u2013",
                  fmtTime(e.committed_at),
                ]),
            ),
          ]);
        }

        function setDrawer(open) {
