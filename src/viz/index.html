        function notebookEntries() {
          const admitted = model.rules.map((r) => ({
            rule: r,
            ep: model.byKey.get(r.episode_key) || null,
          }));
          let entries;
          if (state.showRejected || state.episode) {
            const extra = model.episodes
              .filter(
                (e) =>
                  !e.admitted &&
                  (e.rule_id || e.record) &&
                  (state.showRejected || e.key === state.episode),
              )
              .map((e) => ({ rule: null, ep: e }));
            entries = [...admitted, ...extra];
          } else entries = admitted;
          if (state.episode && !entries.some((x) => x.ep && x.ep.key === state.episode)) {
            const ep = model.byKey.get(state.episode);
            if (ep) entries.push({ rule: null, ep });
          }
          const when = (x) => num(x.ep && x.ep.committed_at) ?? -Infinity;
          const rev = (x) => (x.rule ? x.rule.revision : -Infinity);
          entries.sort((a, b) => when(b) - when(a) || rev(b) - rev(a));
          return entries.filter((x) => {
            const gen = x.rule ? x.rule.generation : x.ep.generation;
            const inputs = (x.rule && x.rule.inputs) || (x.ep && x.ep.inputs) || [];
            const id = x.rule ? x.rule.rule_id : x.ep.rule_id;
            if (state.episode) return x.ep && x.ep.key === state.episode;
            if (state.rule) return id === state.rule;
            if (!genOn(gen)) return false;
            if (state.input && !inputs.includes(state.input)) return false;
            return true;
          });
        }
        function idButton(id) {
          const known = model.ruleById.has(id);
          if (!known) return el("span", { class: "idtext", title: id, text: shortId(id) });
          const b = el("button", { class: "idlink", type: "button", title: id, text: shortId(id) });
          b.addEventListener("click", () => openRule(id));
          return b;
        }
        function card(x) {
          const ep = x.ep;
          const rule = x.rule;
          const rec = ep && ep.record && typeof ep.record === "object" ? ep.record : null;
          const stage = rule ? "admitted" : ep.stage;
          const ruleId = rule ? rule.rule_id : ep.rule_id;
          const score = ep && ep.score ? ep.score : null;
          const inputs = (rule && rule.inputs) || (ep && ep.inputs);
          const parents = rule ? rule.parents : ep.parents;
          const gen = rule ? rule.generation : ep.generation;
          const focus =
            (state.rule && state.rule === ruleId) ||
            (state.episode && ep && state.episode === ep.key);
          const head = el(
            "div",
            { class: "card-head" },
            stageBadge(stage),
            el(
              "span",
              null,
              el("span", {
                class: "dot",
                style: `background:${genVar(gen)};margin-right:5px;vertical-align:-1px`,
              }),
              `Gen ${gen}`,
            ),
            ruleId
              ? el("span", { class: "mono", title: ruleId, text: `rule ${shortId(ruleId)}` })
              : null,
            rule ? el("span", { text: `revision ${rule.revision}` }) : null,
            ep ? el("span", { class: "mono", text: ep.key }) : null,
          );
          const body = [];
          if (rec && rec.hypothesis)
            body.push(el("p", { class: "hyp", text: str(rec.hypothesis) }));
          else
            body.push(
              el("p", {
                class: "hyp",
                style: "color:var(--text-2)",
                text: "No public hypothesis record for this episode.",
              }),
            );
          if (ep && ep.rewrite)
            body.push(
              el(
                "div",
                { class: "rewrite" },
                el("span", { class: "k", text: "Plain-language rewrite" }),
                str(ep.rewrite),
              ),
            );
          if (rec && rec.expression)
            body.push(el("pre", { class: "expr", text: str(rec.expression) }));
          if (inputs && inputs.length) {
            body.push(
              el(
                "div",
                { class: "inchips" },
                inputs.map((n) => {
                  const b = el("button", {
                    class: "inchip",
                    type: "button",
                    "aria-pressed": String(state.input === n),
                    text: n,
                  });
                  b.addEventListener("click", () => toggleInput(n));
                  return b;
                }),
              ),
            );
          } else if (inputs === null && ep && !journalOnly(ep)) {
            body.push(el("div", { class: "metrics", text: "Inputs not recorded." }));
          }
          const gain = score ? num(score.stage2_gain) : rule ? rule.stage2_gain : null;
          const metrics = [];
          if (gain !== null)
            metrics.push(el("span", null, "stage-2 gain ", el("b", { text: fmt(gain) })));
          if (score) {
            metrics.push(
              el("span", null, "lower bound ", el("b", { text: fmt(score.stage2_lower_bound) })),
            );
            metrics.push(el("span", null, "complexity ", el("b", { text: fmt(score.complexity) })));
          }
          const cause = ep ? causeOf(ep) : null;
          if (cause)
            metrics.push(
              el("span", null, "stop cause ", el("b", { text: cause.replace(/_/g, " ") })),
            );
          if (metrics.length) body.push(el("div", { class: "metrics" }, metrics));
          if (parents !== undefined && ep && !journalOnly(ep)) {
            body.push(
              el(
                "div",
                { class: "parents" },
                el("span", { text: "Parents" }),
                parents === null
                  ? el("span", { text: "not recorded" })
                  : parents.length
                    ? parents.map(idButton)
                    : el("span", { text: "seed rule (none assigned)" }),
              ),
            );
          }
          const claimed = ep ? ep.claimed_parents : [];
          if (claimed.length) {
            body.push(
              el(
                "div",
                { class: "parents" },
                el("span", { text: "Claimed by the agent" }),
                claimed.map(idButton),
              ),
            );
          }
          if (rec) {
            const fields = [
              ["rationale", "Rationale"],
              ["applicability", "Applicability"],
              ["uncertainty", "Uncertainty"],
              ["discriminating_test", "Discriminating test"],
            ].filter(([k]) => rec[k] !== null && rec[k] !== undefined && rec[k] !== "");
            if (fields.length) {
              body.push(
                el(
                  "details",
                  null,
                  el("summary", { text: "Rationale and tests" }),
                  fields.map(([k, label]) =>
                    el(
                      "div",
                      { class: "field" },
                      el("span", { class: "k", text: label }),
                      k === "uncertainty"
                        ? el("code", {
                            style: "font-family:var(--mono);font-size:12px",
                            text: str(rec[k]),
                          })
                        : str(rec[k]),
                    ),
                  ),
                ),
              );
            }
          }
          return el("article", { class: `card${focus ? " focus" : ""}` }, head, body);
        }
        function renderNotebook() {
          if (!drawerParts) return;
          const { filters, count, list, rejected } = drawerParts;
          rejected.checked = state.showRejected;
          const pills = [];
          const pill = (label, value, clear) =>
            el(
              "span",
              { class: "filter-pill" },
              el("span", { text: label }),
              el("span", { class: "v", text: value }),
              el("button", {
                type: "button",
                "aria-label": `Clear ${label.toLowerCase()} filter`,
                text: "\u00d7",
                on: { click: clear },
              }),
            );
          if (state.rule)
            pills.push(
              pill("Rule", shortId(state.rule), () => {
                state.rule = null;
                renderAll();
              }),
            );
          if (state.episode)
            pills.push(
              pill("Episode", state.episode, () => {
                state.episode = null;
                renderAll();
              }),
            );
          if (state.input) pills.push(pill("Input", state.input, () => setInput(null)));
          if (state.gens.size !== model.gens.length)
            pills.push(
              pill("Generations", [...state.gens].sort((a, b) => a - b).join(", "), () => {
                state.gens = new Set(model.gens);
                renderAll();
              }),
            );
          fill(filters, ...pills);
          filters.hidden = !pills.length;
          const entries = notebookEntries();
          const nb = document.getElementById("notebook-count");
          if (nb) nb.textContent = String(model.rules.length);
          const shown = entries.slice(0, state.notebookLimit);
          const nAdmitted = entries.filter((x) => x.rule).length;
          const nOther = entries.length - nAdmitted;
          const parts = [];
          if (nAdmitted || !nOther) parts.push(plural(nAdmitted, "admitted rule"));
          if (nOther) parts.push(plural(nOther, "episode not admitted", "episodes not admitted"));
          count.textContent = `${parts.join(" + ")}, newest first${shown.length < entries.length ? ` \u00b7 showing ${shown.length}` : ""}`;
          if (!entries.length) {
            fill(
              list,
              emptyState(
                model.rules.length || state.showRejected
                  ? "No entries match these filters"
                  : "No admitted rules yet",
                model.rules.length || state.showRejected
                  ? "Clear a filter above to see more."
                  : "Tick \u201cShow rejected episodes\u201d to read the hypotheses that did not make it.",
              ),
            );
            return;
          }
          const rest = entries.length - shown.length;
          let more = null;
          if (rest) {
            more = el("button", {
              class: "btn",
              type: "button",
              "data-key": "notebook-more",
              text: `Show ${Math.min(NOTEBOOK_PAGE, rest)} more (${rest} not shown)`,
            });
            more.addEventListener("click", () => {
              state.notebookLimit += NOTEBOOK_PAGE;
              keepFocus(renderNotebook);
            });
          }
          fill(list, ...shown.map(card), more);
        }

        let renderedGens = null;
        function renderAll() {
          keepFocus(() => {
            hideTip();
            state.notebookLimit = NOTEBOOK_PAGE;
            const gens = [...state.gens].sort((a, b) => a - b).join(",");
            renderChips();
            renderCoverage();
            renderLineage();
            if (gens !== renderedGens) {
              renderRising();
              renderProcess();
              renderSieve();
              renderedGens = gens;
            }
            renderNotebook();
          });
        }
        let resizeTimer = 0;
        function scheduleRender() {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(() => {
            renderLineage();
            renderRising();
          }, 120);
        }

        function start(doc) {
          if (!doc || typeof doc !== "object") throw new Error("viz data is not an object");
          model = buildModel(doc);
          state.gens = new Set(model.gens);
          injectColorTokens(model);
          if (doc.run_id) document.title = `Run ${str(doc.run_id)}`;
          buildPage();
          renderAll();
          const main = document.querySelector("main");
          let lastWidth = main.clientWidth;
          const onResize = () => {
            if (main.clientWidth === lastWidth) return;
            lastWidth = main.clientWidth;
            scheduleRender();
          };
          if (window.ResizeObserver) new ResizeObserver(onResize).observe(main);
          else window.addEventListener("resize", onResize);
          document.addEventListener("keydown", (ev) => {
            if (ev.key !== "Escape") return;
            if (!tip.hidden) {
              hideTip();
              return;
            }
            if (state.input) {
              setInput(null);
              return;
            }
            if (state.rule || state.episode) {
              state.rule = null;
              state.episode = null;
              renderAll();
              return;
            }
            if (document.body.classList.contains("drawer-open")) setDrawer(false);
          });
          document.getElementById("app").dataset.ready = "true";
        }

        loadDocument()
          .then(start)
          .catch((err) => {
            const app = document.getElementById("app");
            fill(
              app,
              el(
                "div",
                { class: "empty", role: "alert" },
                el("strong", { text: "Could not load the run data" }),
                el("span", { text: str(err && err.message ? err.message : err) }),
              ),
            );
            app.dataset.ready = "error";
          });
      })();
    </script>
  </body>
</html>
